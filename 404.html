<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 — 제천 JC호텔</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/jc-hotel/favicon.ico" sizes="48x48">
<link rel="icon" href="/jc-hotel/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/jc-hotel/apple-touch-icon.png">
<meta name="theme-color" content="#0E1C1B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Italiana&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#0E1C1B; --deep:#15302D; --mist:#DDE4E1;
  --brass:#C0A062; --line:rgba(192,160,98,.28);
  --disp:'Gowun Batang', serif; --lat:'Italiana', serif;
  --body:'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif;
  --pad:clamp(20px,5vw,72px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ink);color:var(--mist);font-family:var(--body);
  font-size:16px;line-height:1.8;min-height:100svh;display:flex;flex-direction:column;
  -webkit-tap-highlight-color:rgba(192,160,98,.2);
}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}

.nav{display:flex;align-items:center;justify-content:space-between;padding:22px var(--pad);border-bottom:1px solid var(--line)}
.brand{font-family:var(--lat);font-size:clamp(24px,2.8vw,34px);letter-spacing:.24em;line-height:1}
.brand small{display:block;font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.42em;color:var(--brass);margin-top:5px}
.nav .tel{font-family:var(--lat);font-size:17px;letter-spacing:.12em;color:var(--brass);padding:8px 0}

main{flex:1;display:flex;align-items:center;padding:clamp(56px,10vh,110px) var(--pad)}
.wrap{max-width:640px}
.code{font-family:var(--lat);font-size:clamp(56px,10vw,104px);line-height:1;color:var(--brass);letter-spacing:.06em;margin:0 0 22px}
h1{font-family:var(--disp);font-weight:700;font-size:clamp(25px,3.6vw,40px);line-height:1.35;margin:0 0 18px;color:#fff}
p{margin:0 0 28px;color:rgba(221,228,225,.7)}

.links{display:flex;flex-wrap:wrap;gap:10px}
.links a{
  display:inline-block;padding:13px 22px;font-size:14.5px;letter-spacing:.02em;
  border:1px solid var(--line);color:var(--brass);transition:background .25s,color .25s;
}
.links a:hover{background:var(--brass);color:var(--ink)}
.links a.solid{background:var(--brass);color:var(--ink);font-weight:600}
.links a.solid:hover{background:#D4B478}

footer{border-top:1px solid var(--line);padding:26px var(--pad);font-size:12.5px;color:rgba(221,228,225,.45)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<nav class="nav">
  <a class="brand" href="/jc-hotel/">JC HOTEL<small>제천</small></a>
  <a class="tel" href="tel:043-651-8000">043-651-8000</a>
</nav>

<main>
  <div class="wrap">
    <p class="code">404</p>
    <h1>찾으시는 페이지가<br>없습니다.</h1>
    <p>주소가 바뀌었거나 지워진 페이지입니다.
       예약이나 문의가 급하시면 프런트로 전화 주십시오. 24시간 받습니다.</p>
    <div class="links">
      <a class="solid" href="/jc-hotel/">호텔 안내로</a>
      <a href="/jc-hotel/#rooms">객실 보기</a>
      <a href="/jc-hotel/#breakfast">조식</a>
      <a href="tel:043-651-8000">043-651-8000</a>
      <a href="/jc-hotel/en/">English</a>
    </div>
  </div>
</main>

<footer>
  JC호텔 (제천 JC호텔 · 제천관광호텔) · 충북 제천시 명동 5-12 · 043-651-8000
</footer>

</body>
</html>
