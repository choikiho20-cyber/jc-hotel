<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소식 — 제천 JC호텔 (제천관광호텔)</title>
<meta name="description" content="제천 JC호텔의 소식과 제천 여행 정보. 예술의전당, 청풍호, 의림지 등 제천을 찾는 손님께 필요한 안내를 정리합니다.">

<!-- [교체] 도메인 확정 시 https://choikiho20-cyber.github.io/jc-hotel 일괄 치환 -->
<link rel="canonical" href="https://choikiho20-cyber.github.io/jc-hotel/blog.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="제천 JC호텔">
<meta property="og:title" content="소식 — 제천 JC호텔">
<meta property="og:description" content="제천 JC호텔의 소식과 제천 여행 정보.">
<meta property="og:image" content="https://choikiho20-cyber.github.io/jc-hotel/images/og-cover.jpg">
<meta property="og:url" content="https://choikiho20-cyber.github.io/jc-hotel/blog.html">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://choikiho20-cyber.github.io/jc-hotel/images/og-cover.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Italiana&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
:root{
  --ink:#0E1C1B; --deep:#15302D; --mist:#DDE4E1;
  --brass:#C0A062; --brass-d:#8A7040; --line:rgba(192,160,98,.28);
  --disp:'Gowun Batang', serif; --lat:'Italiana', serif;
  --body:'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif;
  --pad:clamp(20px,5vw,72px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);-webkit-tap-highlight-color:rgba(192,160,98,.2);color:var(--mist);font-family:var(--body);font-size:16px;line-height:1.8}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}

.nav{display:flex;align-items:center;justify-content:space-between;padding:22px var(--pad);border-bottom:1px solid var(--line)}
.brand{font-family:var(--lat);font-size:clamp(24px,2.8vw,34px);letter-spacing:.24em;line-height:1}
.brand small{display:block;font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.42em;color:var(--brass);margin-top:5px}
.nav a.back{display:inline-block;padding:10px 0 10px 12px;font-size:14px;color:rgba(221,228,225,.75)}
.nav a.back:hover{color:var(--brass)}

main{max-width:820px;margin:0 auto;padding:clamp(56px,8vw,104px) var(--pad) 100px}
.eyebrow{font-family:var(--lat);font-size:13px;letter-spacing:.34em;text-transform:uppercase;color:var(--brass);margin:0 0 16px}
h1{font-family:var(--disp);font-weight:700;font-size:clamp(30px,4.6vw,48px);line-height:1.34;margin:0 0 18px;letter-spacing:-.01em}
.desc{color:rgba(221,228,225,.66);margin:0 0 52px}

.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid rgba(255,255,255,.09)}
.list li:last-child{border-bottom:1px solid rgba(255,255,255,.09)}
.list a{display:block;padding:clamp(22px,5vw,30px) 0;transition:padding-left .3s}
.list a:hover{padding-left:12px}
.list time{font-family:var(--lat);font-size:13px;letter-spacing:.16em;color:var(--brass-d)}
.list h2{font-family:var(--disp);font-weight:700;font-size:clamp(19px,2.3vw,25px);line-height:1.45;margin:8px 0 10px}
.list p{margin:0;font-size:15px;color:rgba(221,228,225,.6)}
.tags{margin-top:14px;display:flex;flex-wrap:wrap;gap:7px}
.tag{font-size:12px;padding:5px 11px;border:1px solid var(--line);color:rgba(221,228,225,.65)}

article time{font-family:var(--lat);font-size:13px;letter-spacing:.16em;color:var(--brass-d)}
article h1{margin-top:10px}
.bodytext{margin-top:40px;font-size:17px}
.bodytext p{margin:0 0 20px;color:rgba(221,228,225,.8)}
.bodytext h3{font-family:var(--disp);font-weight:700;font-size:21px;color:#fff;margin:38px 0 12px}
.bodytext strong{color:#fff;font-weight:600}
.back-link{display:inline-block;margin-top:56px;padding-bottom:3px;border-bottom:1px solid var(--line);color:var(--brass);font-size:15px}

footer{border-top:1px solid var(--line);padding:44px var(--pad);font-size:13px;color:rgba(221,228,225,.45)}
.empty{padding:60px 0;color:rgba(221,228,225,.5)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<nav class="nav">
  <a class="brand" href="index.html">JC HOTEL<small>제천</small></a>
  <a class="back" href="index.html">← 호텔 안내</a>
</nav>

<main id="main">
  <p class="eyebrow">Journal</p>
  <h1>제천에 오시는 분께<br>필요한 이야기.</h1>
  <p class="desc">호텔 소식과 제천 여행 정보를 정리합니다.</p>
  <ul class="list" id="list"><li class="empty" style="border:0">불러오는 중…</li></ul>
</main>

<footer>
  © 2026 JC호텔 (제천 JC호텔 · 제천관광호텔)
</footer>

<script>
const list = document.getElementById('list');
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const renderList = posts => {
  document.title = '소식 — 제천 JC호텔 (제천관광호텔)';
  if (!posts.length) { list.innerHTML = '<li class="empty" style="border:0">준비 중입니다.</li>'; return; }
  list.innerHTML = posts.map(p => `
    <li><a href="?id=${p.id}">
      <time datetime="${esc(p.date)}">${esc(p.date)}</time>
      <h2>${esc(p.title)}</h2>
      <p>${esc(p.summary || '')}</p>
      <div class="tags">${(p.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
    </a></li>`).join('');
};

const renderPost = p => {
  document.title = p.title + ' — 제천 JC호텔';
  document.querySelector('main').innerHTML = `
    <article>
      <time datetime="${esc(p.date)}">${esc(p.date)}</time>
      <h1>${esc(p.title)}</h1>
      <div class="tags">${(p.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
      <div class="bodytext">${p.content || ''}</div>
      <a class="back-link" href="blog.html">← 목록으로</a>
    </article>`;
  // 검색엔진·AI가 글 단위로 인용할 수 있도록 구조화 데이터를 넣습니다
  const ld = document.createElement('script');
  ld.type = 'application/ld+json';
  ld.textContent = JSON.stringify({
    '@context': 'https://schema.org', '@type': 'BlogPosting',
    headline: p.title, datePublished: p.date, dateModified: p.date,
    description: p.summary || '', keywords: (p.tags || []).join(', '),
    author: { '@type': 'Organization', name: '제천 JC호텔' },
    publisher: { '@type': 'Organization', name: '제천 JC호텔' },
    mainEntityOfPage: location.origin + location.pathname + '?id=' + p.id
  });
  document.head.appendChild(ld);
};

fetch('posts.json?' + Date.now())
  .then(r => r.ok ? r.json() : [])
  .then(posts => {
    posts.sort((a, b) => String(b.date).localeCompare(String(a.date)));
    const id = new URLSearchParams(location.search).get('id');
    const post = id && posts.find(p => String(p.id) === id);
    post ? renderPost(post) : renderList(posts);
  })
  .catch(() => { list.innerHTML = '<li class="empty" style="border:0">글을 불러오지 못했습니다.</li>'; });
</script>
</body>
</html>
