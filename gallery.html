<style>
:root{
  --ink:#0E1C1B; --deep:#15302D; --mist:#DDE4E1;
  --brass:#C0A062; --brass-d:#8A7040; --line:rgba(192,160,98,.28);
  --disp:'Gowun Batang', serif; --lat:'Italiana', serif;
  --body:'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif;
  --pad:clamp(20px,5vw,72px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);-webkit-tap-highlight-color:rgba(192,160,98,.2);color:var(--mist);font-family:var(--body);font-size:16px;line-height:1.8}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{max-width:100%}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}

.nav{display:flex;align-items:center;justify-content:space-between;padding:22px var(--pad);border-bottom:1px solid var(--line)}
.brand{font-family:var(--lat);font-size:clamp(24px,2.8vw,34px);letter-spacing:.24em;line-height:1}
.brand small{display:block;font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.42em;color:var(--brass);margin-top:5px}
.nav a.back{display:inline-block;padding:10px 0 10px 12px;font-size:14px;color:rgba(221,228,225,.75)}
.nav a.back:hover{color:var(--brass)}

main{max-width:1400px;margin:0 auto;padding:clamp(48px,7vw,88px) var(--pad) 96px}
.eyebrow{font-family:var(--lat);font-size:13px;letter-spacing:.34em;text-transform:uppercase;color:var(--brass);margin:0 0 16px}
h1{font-family:var(--disp);font-weight:700;font-size:clamp(30px,4.6vw,48px);line-height:1.34;margin:0 0 18px;letter-spacing:-.01em}
.desc{color:rgba(221,228,225,.66);margin:0 0 40px;max-width:60ch}

.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 34px}
.tab{padding:9px 17px;border:1px solid var(--line);font-size:14px;color:rgba(221,228,225,.72);transition:.2s}
.tab span{font-family:var(--lat);font-size:12px;color:var(--brass-d);margin-left:5px}
.tab:hover{border-color:var(--brass);color:#fff}
.tab.on{background:var(--brass);border-color:var(--brass);color:var(--ink);font-weight:600}
.tab.on span{color:rgba(14,28,27,.6)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:3px}
.cell{padding:0;display:block;position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--deep)}
.cell img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .55s ease,opacity .3s}
.cell:hover img{transform:scale(1.045)}
.cell[hidden]{display:none}
.count{margin:26px 0 0;font-size:13px;color:rgba(221,228,225,.42)}
.srcnote{margin:10px 0 0;font-size:12.5px;color:rgba(221,228,225,.36);max-width:70ch}

dialog.lb{border:0;padding:0;max-width:100vw;max-height:100vh;width:100vw;height:100vh;background:rgba(8,16,15,.97);color:var(--mist)}
dialog.lb::backdrop{background:rgba(8,16,15,.9)}
.lb-wrap{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 16px 76px;position:relative}
.lb-wrap img{max-width:min(1200px,94vw);max-height:calc(100vh - 168px);object-fit:contain;display:block}
.lb-cap{margin:16px 0 0;font-size:14px;color:rgba(221,228,225,.72);text-align:center;max-width:70ch}
.lb-n{position:absolute;top:18px;left:var(--pad);font-family:var(--lat);font-size:13px;letter-spacing:.16em;color:var(--brass)}
.lb-x{position:absolute;top:12px;right:14px;width:46px;height:46px;border-radius:50%;font-size:24px;line-height:1;color:rgba(221,228,225,.85);background:rgba(8,16,15,.55)}
.lb-p,.lb-nx{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;font-size:26px;color:rgba(221,228,225,.85);background:rgba(8,16,15,.55);backdrop-filter:blur(2px)}
.lb-p{left:4px} .lb-nx{right:4px}
.lb-p:hover,.lb-nx:hover,.lb-x:hover{color:var(--brass);background:rgba(8,16,15,.8)}

footer{border-top:1px solid var(--line);padding:44px var(--pad);font-size:13px;color:rgba(221,228,225,.45);display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between}
footer a.tel{color:var(--brass)}
@media(max-width:640px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px}
  .lb-p,.lb-nx{width:40px;height:40px;font-size:22px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    <p class="lb-n" id="lbn"></p>
    <button class="lb-x" id="lbx" aria-label="닫기">&times;</button>
    <button class="lb-p" id="lbp" aria-label="이전 사진">&#8249;</button>
    <img id="lbimg" alt="">
    <p class="lb-cap" id="lbcap"></p>
    <button class="lb-nx" id="lbnx" aria-label="다음 사진">&#8250;</button>
  </div>

</footer>

<script>
const cells = [...document.querySelectorAll('.cell')];
const grid  = document.getElementById('grid');
const count = document.getElementById('count');
const lb    = document.getElementById('lb');
const lbimg = document.getElementById('lbimg');
const lbcap = document.getElementById('lbcap');
const lbn   = document.getElementById('lbn');

// 필터 — 보이는 것만 라이트박스 순서에 넣는다
let shown = cells.slice();

const setCount = () => { count.textContent = shown.length + (document.documentElement.lang === 'ko' ? '장' : ' photos'); };

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const cat = tab.dataset.cat;
    document.querySelectorAll('.tab').forEach(t => {
      const on = t === tab;
      t.classList.toggle('on', on);
      t.setAttribute('aria-pressed', on);
    });
    cells.forEach(c => { c.hidden = !(cat === 'all' || c.dataset.cat === cat); });
    shown = cells.filter(c => !c.hidden);
    setCount();
  });
});

let at = 0;
const show = i => {
  at = (i + shown.length) % shown.length;
  const img = shown[at].querySelector('img');
  lbimg.src = img.currentSrc || img.src;
  lbimg.alt = img.alt;
  lbcap.textContent = img.alt;
  lbn.textContent = (at + 1) + ' / ' + shown.length;
};

grid.addEventListener('click', e => {
  const cell = e.target.closest('.cell');
  if (!cell) return;
  show(shown.indexOf(cell));
  lb.showModal();
});

document.getElementById('lbx').addEventListener('click', () => lb.close());
document.getElementById('lbp').addEventListener('click', () => show(at - 1));
document.getElementById('lbnx').addEventListener('click', () => show(at + 1));
lb.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { e.preventDefault(); show(at + 1); }
  if (e.key === 'ArrowLeft')  { e.preventDefault(); show(at - 1); }
});
// 배경(사진 바깥) 클릭으로 닫기
lb.addEventListener('click', e => { if (e.target === lb || e.target.classList.contains('lb-wrap')) lb.close(); });

setCount();
</script>
